<html lang="en">
<head>
<meta charset="UTF-8">

<title>Druguessr 💊</title>
<style>
  :root {
    --color-text-primary: #1a1a1a;
    --color-text-secondary: #6b7280;
    --color-text-tertiary: #9ca3af;
    --color-text-danger: #dc2626;
    --color-background-primary: #ffffff;
    --color-background-secondary: #f3f4f6;
    --color-background-tertiary: #787c7e;
    --color-border-secondary: #d1d5db;
    --color-border-tertiary: #e5e7eb;
    --color-border-primary: #6b7280;
    --border-radius-md: 6px;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-text-primary: #f9fafb;
      --color-text-secondary: #9ca3af;
      --color-text-tertiary: #6b7280;
      --color-text-danger: #f87171;
      --color-background-primary: #111827;
      --color-background-secondary: #1f2937;
      --color-background-tertiary: #374151;
      --color-border-secondary: #374151;
      --color-border-tertiary: #1f2937;
      --color-border-primary: #9ca3af;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--color-background-primary); color: var(--color-text-primary); }
  #app { max-width: 600px; margin: 0 auto; padding: 1rem 0.5rem 2rem; }
  h1 { font-size: 22px; font-weight: 500; text-align: center; letter-spacing: 3px; color: var(--color-text-primary); margin-bottom: 2px; }
  .subtitle { text-align: center; font-size: 12px; color: var(--color-text-secondary); margin-bottom: 1rem; }
  #hint-bar { text-align: center; font-size: 13px; color: var(--color-text-secondary); min-height: 20px; margin-bottom: 0.5rem; }
  #class-hint { text-align: center; font-size: 13px; color: var(--color-text-primary); min-height: 20px; margin-bottom: 0.5rem; font-weight: 500; display: none; }
  #grid { display: flex; flex-direction: column; gap: 3px; margin-bottom: 1rem; align-items: center; }
  .row { display: flex; gap: 3px; }
  .cell { width: 38px; height: 36px; border: 0.5px solid var(--color-border-secondary); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: var(--color-text-primary); background: var(--color-background-primary); text-transform: uppercase; flex-shrink: 0; }
  .cell.correct { background: #538d4e; border-color: #538d4e; color: #fff; }
  .cell.present { background: #b59f3b; border-color: #b59f3b; color: #fff; }
  .cell.absent { background: var(--color-background-tertiary); border-color: var(--color-background-tertiary); color: #fff; }
  .cell.skip { background: var(--color-background-secondary); border-color: var(--color-border-tertiary); color: var(--color-text-tertiary); }
  .cell.extra { background: transparent; border-color: var(--color-border-tertiary); opacity: 0.4; }
  #keyboard { display: flex; flex-direction: column; gap: 6px; align-items: center; margin-top: 0.5rem; }
  .kb-row { display: flex; gap: 4px; }
  .kb-key { min-width: 28px; height: 42px; padding: 0 6px; border: 0.5px solid var(--color-border-secondary); border-radius: 4px; background: var(--color-background-secondary); color: var(--color-text-primary); font-size: 12px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; text-transform: uppercase; user-select: none; }
  .kb-key.wide { min-width: 48px; font-size: 11px; }
  .kb-key.star { min-width: 36px; font-size: 16px; }
  .kb-key.correct { background: #538d4e; border-color: #538d4e; color: #fff; }
  .kb-key.present { background: #b59f3b; border-color: #b59f3b; color: #fff; }
  .kb-key.absent { background: var(--color-background-tertiary); border-color: transparent; color: var(--color-text-tertiary); }
  #msg { text-align: center; font-size: 13px; font-weight: 500; min-height: 22px; color: var(--color-text-primary); margin-bottom: 0.5rem; }
  .legend { display: flex; gap: 12px; justify-content: center; font-size: 11px; color: var(--color-text-secondary); margin-bottom: 0.5rem; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 2px; }
  .legend-dot.g { background: #538d4e; }
  .legend-dot.y { background: #b59f3b; }
  .legend-dot.x { background: #787c7e; }
  .legend-dot.s { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-secondary); }
  #attempts { text-align: center; font-size: 11px; color: var(--color-text-secondary); margin-bottom: 0.75rem; }
  #input-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 0.75rem; }
  #guess-input { border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 6px 10px; font-size: 14px; background: var(--color-background-primary); color: var(--color-text-primary); width: 220px; }
  #guess-input::placeholder { text-transform: none; color: var(--color-text-tertiary); }
  #submit-btn { padding: 6px 14px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-secondary); color: var(--color-text-primary); font-size: 13px; cursor: pointer; }
  #autocomplete { position: relative; width: 220px; }
  #ac-list { position: absolute; top: 100%; left: 0; right: 0; background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); z-index: 10; max-height: 160px; overflow-y: auto; display: none; }
  .ac-item { padding: 6px 10px; font-size: 13px; cursor: pointer; color: var(--color-text-primary); }
  .ac-item:hover { background: var(--color-background-secondary); }
  .star-hint { text-align: center; font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 0.75rem; }
  #action-btns { display: flex; gap: 8px; justify-content: center; margin-top: 0.75rem; flex-wrap: wrap; }
  .action-btn { padding: 6px 16px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-secondary); color: var(--color-text-primary); font-size: 12px; cursor: pointer; }
  .action-btn:disabled { opacity: 0.4; cursor: default; }
  #hint-btn { border-color: #b59f3b; color: #b59f3b; }
  #hint-btn:hover:not(:disabled) { background: rgba(181,159,59,0.1); }
  #reveal-btn { border-color: #dc2626; color: var(--color-text-danger); }
  #reveal-btn:hover:not(:disabled) { background: rgba(220,38,38,0.1); }
  #new-game-btn { display: none; padding: 8px 20px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-secondary); color: var(--color-text-primary); font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <h1>💊 DRUGUESSR</h1>
  <div class="subtitle">Guess the INN drug name · 8 attempts</div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot g"></div> Correct spot</div>
    <div class="legend-item"><div class="legend-dot y"></div> Wrong spot</div>
    <div class="legend-item"><div class="legend-dot x"></div> Not in word</div>
    <div class="legend-item"><div class="legend-dot s"></div> Skipped (*)</div>
  </div>
  <div class="star-hint">Use * to skip positions — e.g. <strong>a**lo***ol</strong></div>
  <div id="hint-bar"></div>
  <div id="class-hint"></div>
  <div id="grid"></div>
  <div id="msg"></div>
  <div id="attempts"></div>
  <div id="input-row">
    <div id="autocomplete">
      <input id="guess-input" type="text" placeholder="e.g. metformin or a*****" autocomplete="off" />
      <div id="ac-list"></div>
    </div>
    <button id="submit-btn">Enter</button>
  </div>
  <div id="keyboard"></div>
  <div id="action-btns">
    <button class="action-btn" id="hint-btn" onclick="showHint()">💡 Hint (drug class)</button>
    <button class="action-btn" id="reveal-btn" onclick="revealAnswer()">🏳 Give answer</button>
    <button id="new-game-btn" onclick="newGame()">New drug ↺</button>
  </div>
</div>

  document.getElementById("new-game-btn").style.display = "none";
  document.getElementById("guess-input").value = "";
  document.getElementById("guess-input").disabled = false;
  document.getElementById("submit-btn").disabled = false;
  document.getElementById("hint-btn").disabled = false;
  document.getElementById("reveal-btn").disabled = false;
  document.getElementById("hint-bar").textContent = "Drug name has " + target.length + " letter" + (target.length > 1 ? "s" : "");
  document.getElementById("class-hint").style.display = "none";
  document.getElementById("class-hint").textContent = "";
  document.getElementById("attempts").textContent = "Guesses: 0 / " + MAX_GUESSES;
  renderGrid(); renderKeyboard();
  document.getElementById("guess-input").focus();
}

function showHint() {
  if (gameOver) return;
  const cls = DRUG_MAP[target];
  const el = document.getElementById("class-hint");
  el.textContent = "💡 Drug class: " + cls;
  el.style.display = "block";
  document.getElementById("hint-btn").disabled = true;
  hintUsed = true;
}

function revealAnswer() {
  if (gameOver) return;
  document.getElementById("msg").textContent = "🏳 The answer was: " + target.toUpperCase();
  document.getElementById("msg").style.color = "var(--color-text-secondary)";
  endGame();
}

function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (let r = 0; r < MAX_GUESSES; r++) {
    const row = document.createElement("div"); row.className = "row";
    const guess = guesses[r];
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement("div");
      if (guess) {
        if (c < guess.display.length) {
          const ch = guess.display[c];
          cell.className = ch === '*' ? "cell skip" : "cell " + guess.result[c];
          cell.textContent = ch === '*' ? "*" : ch.toUpperCase();
        } else { cell.className = "cell extra"; }
      } else if (r === guesses.length) {
        cell.className = "cell";
        const ch = currentGuess[c] || "";
        cell.textContent = ch === '*' ? '*' : ch.toUpperCase();
        if (ch) cell.style.borderColor = "var(--color-border-primary)";
      } else { cell.className = "cell extra"; }
      row.appendChild(cell);
    }
    grid.appendChild(row);
  }
}

function score(pattern, target) {
  const res = Array(pattern.length).fill("absent");
  const tArr = target.split("");
  const pArr = pattern.split("");
  const used = Array(target.length).fill(false);
  for (let i = 0; i < pArr.length; i++) {
    if (pArr[i] === '*') { res[i] = "skip"; continue; }
    if (i < tArr.length && pArr[i] === tArr[i]) { res[i] = "correct"; used[i] = true; pArr[i] = null; }
  }
  for (let i = 0; i < pArr.length; i++) {
    if (!pArr[i] || res[i] === "skip") continue;
    for (let j = 0; j < tArr.length; j++) {
      if (!used[j] && pArr[i] === tArr[j]) { res[i] = "present"; used[j] = true; break; }
    }
  }
  return res;
}

function renderKeyboard() {
  const kb = document.getElementById("keyboard");
  kb.innerHTML = "";
  const rows = [["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l"],["ENTER","z","x","c","v","b","n","m","⌫"],["*"]];
  const letterState = {};
  for (const g of guesses) {
    for (let i = 0; i < g.display.length; i++) {
      const l = g.display[i]; if (l === '*') continue;
      const s = g.result[i];
      if (!letterState[l] || letterState[l] === "absent" || (letterState[l] === "present" && s === "correct")) letterState[l] = s;
    }
  }
  for (const row of rows) {
    const div = document.createElement("div"); div.className = "kb-row";
    for (const k of row) {
      const btn = document.createElement("button"); btn.className = "kb-key";
      if (k === "ENTER" || k === "⌫") btn.classList.add("wide");
      if (k === "*") btn.classList.add("star");
      btn.textContent = k;
      if (letterState[k.toLowerCase()]) btn.classList.add(letterState[k.toLowerCase()]);
      btn.addEventListener("mousedown", e => { e.preventDefault(); handleVirtualKey(k); });
      div.appendChild(btn);
    }
    kb.appendChild(div);
  }
}

function handleVirtualKey(k) {
  if (gameOver) return;
  if (k === "⌫") { currentGuess = currentGuess.slice(0, -1); syncInput(); renderGrid(); }
  else if (k === "ENTER") { submitGuess(); }
  else if (k === "*" && currentGuess.length < COLS) { currentGuess += "*"; syncInput(); renderGrid(); }
  else if (/^[a-z]$/.test(k) && currentGuess.length < COLS) { currentGuess += k; syncInput(); renderGrid(); }
}

function syncInput() { document.getElementById("guess-input").value = currentGuess; }

function submitGuess() {
  const raw = currentGuess.trim().toLowerCase();
  if (!raw) { flash("Type a drug name or pattern!"); return; }
  const hasStar = raw.includes('*');
  if (hasStar) {
    if (raw.length !== target.length) { flash("Pattern must be " + target.length + " characters (use * for unknowns)"); return; }
    const res = score(raw, target);
    guesses.push({ display: raw, result: res });
    currentGuess = ""; syncInput();
    document.getElementById("attempts").textContent = "Guesses: " + guesses.length + " / " + MAX_GUESSES;
    renderGrid(); renderKeyboard();
    const won = raw.split("").every((ch, i) => ch === "*" || ch === target[i]);
    if (won) showWin();
    else if (guesses.length >= MAX_GUESSES) showLoss();
    else document.getElementById("msg").textContent = "";
  } else {
    if (!DRUGS.includes(raw)) { flash("Not in drug list — check spelling"); return; }
    const res = score(raw, target);
    guesses.push({ display: raw, result: res });
    currentGuess = ""; syncInput();
    document.getElementById("attempts").textContent = "Guesses: " + guesses.length + " / " + MAX_GUESSES;
    renderGrid(); renderKeyboard();
    if (raw === target) showWin();
    else if (guesses.length >= MAX_GUESSES) showLoss();
    else document.getElementById("msg").textContent = "";
  }
  hideAC();
}

function showWin() {
  document.getElementById("msg").textContent = "✓ Correct! " + target.toUpperCase() + " in " + guesses.length + " guess" + (guesses.length > 1 ? "es" : "");
  document.getElementById("msg").style.color = "#538d4e";
  endGame();
}
function showLoss() {
  document.getElementById("msg").textContent = "✗ The answer was: " + target.toUpperCase();
  document.getElementById("msg").style.color = "var(--color-text-danger)";
  endGame();
}
function endGame() {
  document.getElementById("new-game-btn").style.display = "inline-block";
  document.getElementById("guess-input").disabled = true;
  document.getElementById("submit-btn").disabled = true;
  document.getElementById("hint-btn").disabled = true;
  document.getElementById("reveal-btn").disabled = true;
  gameOver = true;
  const cls = DRUG_MAP[target];
  if (cls) {
    const el = document.getElementById("class-hint");
    el.textContent = "💡 Drug class: " + cls;
    el.style.display = "block";
  }
}
function flash(msg) {
  document.getElementById("msg").textContent = msg;
  document.getElementById("msg").style.color = "var(--color-text-secondary)";
  setTimeout(() => { if (!gameOver) document.getElementById("msg").textContent = ""; }, 1800);
}

const input = document.getElementById("guess-input");
const acList = document.getElementById("ac-list");

input.addEventListener("input", e => {
  if (gameOver) return;
  const cleaned = e.target.value.toLowerCase().replace(/[^a-z\* \-]/g, "");
  currentGuess = cleaned; e.target.value = cleaned;
  renderGrid();
  if (!cleaned.includes('*')) showAC(cleaned); else hideAC();
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); submitGuess(); }
  else if (e.key === "Escape") hideAC();
});
document.getElementById("submit-btn").addEventListener("click", submitGuess);

function showAC(val) {
  if (val.length < 2 || val.includes('*')) { hideAC(); return; }
  const matches = DRUGS.filter(d => d.startsWith(val)).slice(0, 8);
  if (!matches.length) { hideAC(); return; }
  acList.innerHTML = ""; acList.style.display = "block";
  for (const m of matches) {
    const item = document.createElement("div"); item.className = "ac-item"; item.textContent = m.toUpperCase();
    item.addEventListener("mousedown", e => { e.preventDefault(); currentGuess = m; input.value = m; hideAC(); renderGrid(); input.focus(); });
    acList.appendChild(item);
  }
}
function hideAC() { acList.style.display = "none"; }
document.addEventListener("click", e => { if (!e.target.closest("#autocomplete")) hideAC(); });

newGame();
</script>
</body>
</html>
